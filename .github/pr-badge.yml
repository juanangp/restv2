# Badges of the pull requests (PR Badge GitHub App, https://pullrequestbadge.com): author, size (lines added)
# and status of the validation of the branch
- label: "PR submitted by:"
  message: "$payload.pull_request.user.login"
  color: "blue"
- label: "PR Size"
  message: "Large: $additions"
  color: "red"
  when: "$additions > 200"
- label: "PR Size"
  message: "Medium: $additions"
  color: "orange"
  when: "$additions > 99 && $additions < 201"
- label: "PR Size"
  message: "Ok: $additions"
  color: "green"
  when: "$additions < 100"
- imageUrl: "https://github.com/$payload.repository.full_name/actions/workflows/validation.yml/badge.svg?branch=$branchName"
  url: "https://github.com/$payload.repository.full_name/actions/workflows/validation.yml?query=branch%3A$branchName"
