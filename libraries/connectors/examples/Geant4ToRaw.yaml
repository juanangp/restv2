# Geant4 -> raw signals pipeline: TRestGeant4Event (restG4 output file) -> drifted and smeared hits ->
# signals of the AlphaCAMM readout channels -> shaped signals (electronics, physical units) -> raw signals, so
# that the same analysis as for the data can be used (noise added with TRestRawSignalAddNoiseProcess).
#   restManager --c libraries/connectors/examples/Geant4ToRaw.yaml --i <restG4 output file>
# The readout is AlphaCAMM.root of rest-common-readouts (by URL; plane at z = 0, normal [0, 0, 1], gasThickness 90 mm),
# with the geometry of the simulation (readout at z = 0, cathode at z = 90 mm, so that z is the drift distance
# as reconstructed by TRestDetectorSignalToHitsProcess).
# The transport parameters can be read instead from the medium file (see Geant4ToDriftHits.yaml), e.g.
# ArIso.root of rest-common-transport. With an amplification
# table in it, TRestDetectorAvalancheProcess (amplificationVoltage, gap) can replace hitsSmearing to get the
# gain and its fluctuations at the voltage instead of a resolution.

manager:
  class: "TRestManager"
  name: "manager"

  run:
    class: "TRestRun"
    name: "restRun"
    inheritInputRun: true
    runUser: "${ENV:USER}"
    runDescription: "Geant4ToRaw"
    inputFileName: ""
    outputFileName: "Run[runNumber]_[runTag]_[experimentName]_RAW.root"

  readoutManager:
    class: "TRestDetectorReadoutManager"
    readouts:
      - inputFileName: "https://github.com/rest-for-physics-toolkit/rest-common-readouts/releases/download/v1.0/AlphaCAMM.root"
        instanceName: "AlphaCAMM_Readout"
        decodingName: "nominal_decoding"

  medium:
    class: "TRestDetectorMedium"
    name: "ArIso"
    pressure: 1 bar
    charge:
      wValue: 26.2 eV
      fanoFactor: 0.2
      driftField: 100 V/cm   # where the transport tables are evaluated (with a mediumFile)
      # Fixed transport (no mediumFile)
      driftVelocity: 11.5 mm/us
      longDiff: 0.03
      transDiff: 0.03
      attachment: 0

  pipeline:
    class: "TRestEventProcessManager"
    name: "pipeline"
    eventsToProcess: 0
    outputEventStorage: true
    geant4ToHits:
      class: "TRestGeant4ToDetectorHitsProcess"
    hitsDrift:
      class: "TRestDetectorHitsDriftProcess"
      fluctuations: "fano"
      maxHits: 1000
    hitsSmearing:
      class: "TRestDetectorHitsSmearingProcess"
      energyReference: 5.9 keV
      resolutionReference: 15
      subtractFano: true
    hitsToSignal:
      class: "TRestDetectorHitsToSignalProcess"
      observables: ["NHitsRejected"]
    signalShaping:
      class: "TRestDetectorSignalShapingProcess"
      shapingType: "shaperSin"
      shapingTime: 0.2 us
    signalToRaw:
      class: "TRestDetectorSignalToRawSignalProcess"
      sampling: 0.04 us
      nPoints: 512
      mode: "sample"
      triggerMode: "firstDeposit"
      triggerDelay: 4 us
      gain: 10
      offset: 250
      maxValue: 4095
      observables: ["TriggerTime", "NSaturatedSignals"]
    addNoise:
      class: "TRestRawSignalAddNoiseProcess"
      noise:
        - method: "white"
          amplitude: 5
