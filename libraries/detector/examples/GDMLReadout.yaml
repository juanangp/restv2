# Veto readout from the GDML of the simulation (one channel per scintillator):
# - volume: the sensitive volumes (the scintillators, where the energy is deposited), one channel each.
# - readoutVolume: where the signal of each channel is collected, here the light guide of the same veto
#   (the volume of the same assembly copy, so it follows the rotation of each layer); the PMT is not in the
#   geometry, its photocathode would be at the end of the light guide. GetReadoutPosition and
#   GetDistanceToReadout (TRestDetectorLightAttenuationProcess) use it.
# Run from the repository root: the decoding and GDML file paths are relative to the working directory:
#   REST_Detector_GenerateGDMLReadout("libraries/detector/examples/GDMLReadout.yaml",
#                                     "libraries/detector/examples/veto_readout_output.root")
readout:
  class: "TRestGDMLReadout"
  name: "Veto_Readout"
  decodingFile: "libraries/detector/examples/veto.dec"
  readoutParameters:
    gdmlFileName: "packages/restG4/examples/13.IAXO/geometry/setup.gdml"
    readoutInfo:
      - volume: .*scintillatorVolume-*
        readoutVolume: scintillatorLightGuideVolume
        offset: 288


#      - volume: .*assembly-([0-9]+).*veto([0-9]+).*scintillatorVolume-1500\.0mm.*
#        readoutVolume: scintillatorLightGuideVolume
#        offset: 0
