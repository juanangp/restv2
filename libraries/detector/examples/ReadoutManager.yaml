readoutManager:
  class: "TRestDetectorReadoutManager"
  readout: "IAXO_D1_Readout"  # readout of the data (processes without readout); both are loaded and viewed
  readouts:
    - inputFileName: "https://github.com/rest-for-physics-toolkit/rest-common-readouts/releases/download/v1.0/IAXO.root"
      instanceName: "IAXO_D1_Readout"
      decodingName: "nominal_decoding"
    - inputFileName: "veto_readout_output.root"
      instanceName: "Veto_Readout"
      decodingName: "veto_decoding"  # name given to Export (REST_Detector_GenerateGDMLReadout)
