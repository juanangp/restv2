# Dead channel recovery: TRestDetectorSignalEvent (input file) -> TRestDetectorSignalEvent with the signals
# of the dead channels recovered from their adjacent channels (given by the readout).
#   restManager --c SignalRecovery.yaml --i <file with TRestDetectorSignalEvent>
# iaxo_readout_output.root is created by the REST_Detector_GenerateMicromegasReadout macro from
# MicromegasReadout.yaml. 4490 and 4489 (physical IDs 41 and 42) are consecutive: their charge comes from
# 4491 and 4487 (physical IDs 40 and 43).

manager:
  class: "TRestManager"
  name: "manager"

  readoutManager:
    class: "TRestDetectorReadoutManager"
    readouts:
      - inputFileName: "iaxo_readout_output.root"
        instanceName: "IAXO_D1_Readout"
        decodingName: "nominal_decoding"

  run:
    class: "TRestRun"
    name: "restRun"
    inputFileName: ""
    outputFileName: "SignalRecovery_output.root"

  pipeline:
    class: "TRestEventProcessManager"
    name: "pipeline"
    eventsToProcess: 0
    outputEventStorage: true
    signalRecovery:
      class: "TRestDetectorSignalRecoveryProcess"
      readout: "IAXO_D1_Readout"
      channelIds: [4490, 4489, 4601]
