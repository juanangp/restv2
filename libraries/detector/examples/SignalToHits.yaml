# Signal -> hits pipeline: TRestDetectorSignalEvent (input file) -> TRestDetectorHitsEvent.
#   restManager --c SignalToHits.yaml --i <file with TRestDetectorSignalEvent>
# The readout is IAXO.root of rest-common-readouts (by URL, downloaded once and cached).

manager:
  class: "TRestManager"
  name: "manager"

  readoutManager:
    class: "TRestDetectorReadoutManager"
    readouts:
      - inputFileName: "https://github.com/rest-for-physics-toolkit/rest-common-readouts/releases/download/v1.0/IAXO.root"
        instanceName: "IAXO_D1_Readout"
        decodingName: "nominal_decoding"

  run:
    class: "TRestRun"
    name: "restRun"
    runNumber: 1
    subRunNumber: 0
    runType: "Test"
    runTag: "SignalToHits"
    runDescription: "SignalToHits"
    experimentName: "Test"
    inputFileName: "SignalToHits_input.root"
    outputFileName: "SignalToHits_output.root"

  pipeline:
    class: "TRestEventProcessManager"
    name: "pipeline"
    eventsToProcess: 0
    outputEventStorage: true
    signalToHits:
      class: "TRestDetectorSignalToHitsProcess"
      readout: "IAXO_D1_Readout"
      driftVelocity: 0.5
      method: "onlyMax"
