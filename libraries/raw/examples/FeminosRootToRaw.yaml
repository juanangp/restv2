# Converts a ROOT file of feminos-daq into TRestRawSignalEvent (run number, tag, description, start time
# and runInfo from its run tree):
#   restManager --c libraries/raw/examples/FeminosRootToRaw.yaml --i R01234_....root
# Run from the repository root: the readout and medium file paths are relative to the working directory.
manager:
  class: "TRestManager"
  name: "manager"

  run:
    class: "TRestRun"
    name: "restRun"
    runUser: "${ENV:USER}"
    inputFileName: ""
    # Resolved before the process reads the run of the DAQ file: [runNumber] or [runTag] here would be the
    # ones of the configuration (or of inputFormat), not the ones of the DAQ
    outputFileName: "RawSignals.root"

  readoutManager:
    class: "TRestDetectorReadoutManager"
    readouts:
      - inputFileName: "https://github.com/rest-for-physics-toolkit/rest-common-readouts/releases/download/v1.0/IAXO.root"
        instanceName: "IAXO_D1_Readout"
        decodingName: "nominal_decoding"

  medium:
    class: "TRestDetectorMedium"
    name: "Ar99_iC4H10_1"
    mediumFile: "https://github.com/rest-for-physics-toolkit/rest-common-transport/releases/download/v1.0/ArIso.root"
    pressure: 1 bar
    temperature: 293.15
    charge:
      wValue: 26.2 eV
      fanoFactor: 0.2
      driftField: 100 V/cm

  pipeline:
    class: "TRestEventProcessManager"
    name: "pipeline"
    eventsToProcess: 0
    outputEventStorage: true

    feminosRootToSignal:
      class: "TRestRawFeminosRootToSignalProcess"
      name: "feminosRootToSignal"
      useFeminosDaqRunInfo: true
    commonNoiseReduction:
      class: "TRestRawCommonNoiseReductionProcess"
      channels:
        - channelRange: [[4320, 4391]]
          mode: 0
          centerWidth: 10
        - channelRange: [[4392, 4463]]
          mode: 0
          centerWidth: 10
        - channelRange: [[4464, 4535]]
          mode: 0
          centerWidth: 10
        - channelRange: [[4536, 4607]]
          mode: 0
          centerWidth: 10
    rawToSignal:
      class: "TRestRawToDetectorSignalProcess"
      sampling: 20ns
      triggerStarts: 0
      gain: 1
      zeroSuppression: true
      baselineRange: [20, 140]
      integralRange: [150, 450]
      pointsThreshold: 3
      signalThreshold: 7
      pointsOverThreshold: 7
      observables:
        - "all"
    signalToHits:
      class: "TRestDetectorSignalToHitsProcess"
#      driftVelocity: 33.4296
      method: "gaussFit"
    hitsToTrack:
      class: "TRestDetectorHitsToTrackProcess"
      clusterDistance: "2.5mm"
      attachEnergy: 500
      attachDistance: [2.5mm, 2.5mm, 4mm]
    trackAnalysis:
      class: "TRestTrackAnalysisProcess"
      cutsEnabled: true
      projections: ["XZ", "YZ"]
      nTracksCut: [1, 10]
      gaussFit: true
      observables:
        - "all"
