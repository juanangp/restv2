# restDAQ configuration: femclient restDAQ.yaml [-e commands.txt]
daq:
  class: "TRestRawDAQMetadata"
  verbose: "info"  # silent, info or debug (also the `verbose` command)
  electronics: "FEMINOS"  # ARC, FEMINOS or DCC
  fems:
    - id: 0
      IP: "192.168.10.2"
  # DCC: the FECs of each FEM
  #  - id: 0
  #    IP: "192.168.10.13"
  #    FECs: [0, 1, 2, 3, 4, 5]
  TCM: "192.168.10.1"  # femclient --tcm
  nEvents: 0  # events of a run, 0: no limit
  time: 0 s  # duration of a run, 0: no limit
  maxFileSize: "100MB"  # a new subrun (file) when reached
  updateRate: 5 s
  prometheusAddress: "0.0.0.0:8080"  # empty: no Prometheus server

run:
  class: "TRestRun"
  runNumber: auto  # a new number in each fopen ($REST_HOME/.rest/runNumber)
  experimentName: "Test"
  runTag: "DUMMY"
  runType: "background"
  runUser: "${ENV:USER}"
  mainDataPath: "/my/data/storage/area/"
  outputFileName: "Run[runNumber]_[runTag]_[experimentName]_[runType]_[subRunNumber].root"
  # Asked by the command addMetadata, with the runTag and the runType
  runInfo:
    MeshV: 300
    DriftV: 500
    PressureB: 1.4
