# Neutrinoless double beta decays (Decay0 events of Xe136bb0n.dat) from the gas volume of a simple geometry
# (gas, vessel and water tank):
#   restG4 NLDBD.yaml

g4Manager:
  class: "TRestGeant4Manager"

  run:
    class: "TRestRun"
    experimentName: "Test"
    runType: "simulation"
    runNumber: 1
    runTag: "NLDBD"
    outputFileName: "Run[runNumber]_[runTag]_[experimentName].root"
    runDescription: "We launch just 100 events to check everything is ok."
    runUser: "${ENV:USER}"

  geant4Metadata:
    class: "TRestGeant4Metadata"
    gdmlFilename: "geometry/mySetupTemplate.gdml"
    subEventTimeDelay: 100 us
    seed: 17021981
    nEvents: 100

    energyRangeStored: [0, 5 MeV]
    activateAllVolumes: false
    activeVolumes:
      - name: "gas"
        maxStep: 1 mm
        sensitive: true

    generator:
      type: "volume"
      from: "gas"
      source:
        use: "Xe136bb0n.dat"

  physicsG4:
    class: "TRestGeant4PhysicsLists"
    cutForGamma: 1 mm
    cutForElectron: 2 mm
    cutForPositron: 1 mm
    cutForMuon: 1 mm
    cutForNeutron: 1 mm
    minEnergyRangeProductionCuts: 1 keV
    maxEnergyRangeProductionCuts: 1 GeV

    physicsList:
      - name: "G4EmLivermorePhysics"
        option:
          - name: "pixe"
            value: "true"
      - name: "G4DecayPhysics"
      - name: "G4RadioactiveDecayPhysics"
      - name: "G4RadioactiveDecay"
        option:
          - name: "ICM"
            value: "true"
          - name: "ARM"
            value: "true"
      - name: "G4HadronElasticPhysicsHP"
      - name: "G4IonBinaryCascadePhysics"
      - name: "G4HadronPhysicsQGSP_BIC_HP"
      - name: "G4NeutronTrackingCut"
      - name: "G4EmExtraPhysics"
