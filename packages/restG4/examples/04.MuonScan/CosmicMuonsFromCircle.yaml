# Cosmic muons (energy from the histogram cosmicmuon of Muons.root, cos2 zenith angle) from a horizontal
# circle of 40 cm radius 10 cm above the detectors:
#   restG4 CosmicMuonsFromCircle.yaml

g4Manager:
  class: "TRestGeant4Manager"

  run:
    class: "TRestRun"
    experimentName: "CosmicMuonScan"
    runType: "simulation"
    runNumber: 111
    runTag: "MuonsFromCircle"
    outputFileName: "Run[runNumber]_[runType]_[runTag]_[runUser].root"
    runDescription: ""
    runUser: "${ENV:USER}"

  geant4Metadata:
    class: "TRestGeant4Metadata"
    gdmlFilename: "geometry/setup.gdml"
    subEventTimeDelay: 100 us
    nEvents: 10000
    seed: 1702198
    saveAllEvents: false
    printProgress: true

    activateAllVolumes: false
    activeVolumes:
      - name: "det_dw_01"
        maxStep: 1 mm
        sensitive: true
      - name: "det_up_01"
        maxStep: 1 mm

    generator:
      type: "surface"
      shape: "circle"
      position: [0, 100 mm, 0]
      size: [400 mm, 0, 0]
      rotationAxis: [1, 0, 0]
      rotationValue: 90 deg
      source:
        particle: "mu-"
        energy:
          type: "TH1D"
          filename: "Muons.root"
          nameInFile: "cosmicmuon"
        angular:
          type: "formula"
          formula: "Cos2"
          direction: [0, -1, 0]

  physicsG4:
    include: "physicsLists.yaml"  # relative to this file
