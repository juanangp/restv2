# Cosmic muons (energy from the histogram cosmicmuon of Muons.root, cos2 zenith angle) from a 30 x 30 cm
# wall 50 cm above the detectors (Z up):
#   restG4 CosmicMuonsFromWall.yaml

g4Manager:
  class: "TRestGeant4Manager"

  run:
    class: "TRestRun"
    experimentName: "CosmicMuonScan"
    runType: "simulation"
    runNumber: 111
    runTag: "MuonsFromWall"
    outputFileName: "Run[runNumber]_[runType]_[runTag]_[runUser].root"
    runDescription: ""
    runUser: "${ENV:USER}"

  geant4Metadata:
    class: "TRestGeant4Metadata"
    gdmlFilename: "geometry/setup.gdml"
    subEventTimeDelay: 100 us
    nEvents: 2500
    seed: 17021981
    saveAllEvents: false
    printProgress: true

    activateAllVolumes: false
    activeVolumes:
      - name: "det_dw_01"
        maxStep: 1 mm
        sensitive: true
      - name: "det_up_01"
        maxStep: 1 mm

    generator:
      type: "surface"
      shape: "wall"
      position: [0, 0, 50 cm]
      size: [30 cm, 30 cm, 0]
      source:
        particle: "mu-"
        energy:
          type: "TH1D"
          filename: "Muons.root"
          nameInFile: "cosmicmuon"
        angular:
          type: "formula"
          formula: "Cos2"
          direction: [0, 0, -1]

  physicsG4:
    class: "TRestGeant4PhysicsLists"
    cutForGamma: 1 um
    cutForElectron: 1 um
    cutForPositron: 1 um
    cutForMuon: 1 mm
    cutForNeutron: 1 mm
    minEnergyRangeProductionCuts: 1 keV
    maxEnergyRangeProductionCuts: 1 GeV

    physicsList:
      - name: "G4EmLivermorePhysics"
      - name: "G4DecayPhysics"
      - name: "G4RadioactiveDecayPhysics"
      - name: "G4RadioactiveDecay"
        option:
          - name: "ICM"
            value: "true"
          - name: "ARM"
            value: "true"
      - name: "G4HadronElasticPhysicsHP"
      - name: "G4IonBinaryCascadePhysics"
      - name: "G4HadronPhysicsQGSP_BIC_HP"
      - name: "G4EmExtraPhysics"
