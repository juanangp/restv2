# 100 GeV muons from a point 50 cm below the detectors, along +Z:
#   restG4 MuonsFromPoint.yaml

g4Manager:
  class: "TRestGeant4Manager"

  run:
    class: "TRestRun"
    experimentName: "MuonScan"
    runType: "simulation"
    runNumber: 111
    runTag: "MuonsFromPoint"
    outputFileName: "Run[runNumber]_[runType]_[runTag]_[runUser].root"
    runDescription: ""
    runUser: "${ENV:USER}"

  geant4Metadata:
    class: "TRestGeant4Metadata"
    gdmlFilename: "geometry/setup.gdml"
    subEventTimeDelay: 100 us
    nEvents: 5000
    seed: 17021981
    saveAllEvents: false

    activateAllVolumes: false
    activeVolumes:
      - name: "det_dw_01"
        maxStep: 1 mm
        sensitive: true
      - name: "det_up_01"
        maxStep: 1 mm

    generator:
      type: "point"
      position: [0, 0, -50 cm]
      source:
        particle: "mu-"
        energy:
          type: "mono"
          energy: 100 GeV
        angular:
          type: "flux"
          direction: [0, 0, 1]

  physicsG4:
    class: "TRestGeant4PhysicsLists"
    cutForGamma: 1 um
    cutForElectron: 1 um
    cutForPositron: 1 um
    cutForMuon: 1 mm
    cutForNeutron: 1 mm
    minEnergyRangeProductionCuts: 1 keV
    maxEnergyRangeProductionCuts: 1 GeV

    physicsList:
      - name: "G4EmLivermorePhysics"
        option:
          - name: "pixe"
            value: "false"
      - name: "G4DecayPhysics"
      - name: "G4RadioactiveDecayPhysics"
      - name: "G4RadioactiveDecay"
        option:
          - name: "ICM"
            value: "true"
          - name: "ARM"
            value: "true"
      - name: "G4HadronElasticPhysicsHP"
      - name: "G4IonBinaryCascadePhysics"
      - name: "G4HadronPhysicsQGSP_BIC_HP"
      - name: "G4EmExtraPhysics"
