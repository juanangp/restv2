# Geant4 analysis of a xrays.yaml or Fe55.yaml simulation: primary and total energy.
#   restManager --c analysis.yaml --i <restG4 output file>

manager:
  class: "TRestManager"
  name: "manager"

  run:
    class: "TRestRun"
    mainDataPath: "."
    inheritInputRun: true
    runType: "g4Analysis"
    runUser: "${ENV:USER}"
    inputFileName: ""
    outputFileName: "Run_[runType]_[runNumber]_[runTag].root"

  pipeline:
    class: "TRestEventProcessManager"
    name: "pipeline"
    eventsToProcess: 0
    nThreads: 1
    outputEventStorage: false

    g4Ana:
      class: "TRestGeant4AnalysisProcess"
      observables: ["energyPrimary", "totalEdep"]
