# restG4 simulation of cosmic-ray showers of CRY (restG4 built with CRY), at sea level, in a 15 cm square
#
#    restG4 CRYSimulation.yaml
#
# The options of CRY are in the section of class TRestGeant4CRY; the generator only places the CRY square.
# Each event is a shower of CRY with all its particles. The simulation stops at nEvents or, with
# maxExposureTime, when CRY has simulated that time (nEvents 0: only then). The generator section of the
# stored TRestGeant4Metadata gets showersUsed and exposureTime (TRestGeant4Metadata::GetCRYExposureTime), to
# normalize to a rate. The geometry is the one of this example (geometry/setup.gdml), a world of 200 mm:
# the CRY square (subBoxLength) must be inside it.
g4Manager:
  class: "TRestGeant4Manager"

  run:
    class: "TRestRun"
    mainDataPath: ""
    verbose: "info"
    experimentName: "CRY"
    runType: "simulation"
    runNumber: "1"
    runTag: "CRYShowers"
    outputFileName: "Run[runNumber]_[runTag]_[experimentName].root"
    runDescription: ""
    runUser: "${ENV:USER}"

  geant4Metadata:
    class: "TRestGeant4Metadata"
    gdmlFilename: "geometry/setup.gdml"
    subEventTimeDelay: 100 us
    seed: 137
    nEvents: 1000
    saveAllEvents: false
    activeVolumes:
      - name: "gasVolume"
        maxStep: 1 mm
        sensitive: true

    generator:
      type: "cry"                # the options of CRY: the section cry below
      position: [0, 90, 0 mm]    # center of the CRY square (its z = 0), above the gas, inside the world
      verticalAxis: [0, 1, 0]    # the CRY +Z (up): the showers go down along -Y

  cry:
    class: "TRestGeant4CRY"
    subBoxLength: 15 cm          # the square where the particles start, about the size of the geometry
    latitude: 42                 # geomagnetic latitude, degrees
    altitude: 0                  # 0, 2100 m or 11300 m
    date: "7-1-2012"             # month-day-year (solar cycle)
    # The particles returned (all by default): muons, neutrons, protons, gammas, electrons (and positrons),
    # pions and kaons, e.g. ["muons"] for only the muons, ["gammas", "electrons"] for the electromagnetic part
    particles: ["muons", "neutrons", "protons", "gammas", "electrons", "pions", "kaons"]
    maxExposureTime: 1 day       # optional: also stops when CRY has simulated this time

  physicsG4:
    class: "TRestGeant4PhysicsLists"
    cutForGamma: 1.0
    cutForElectron: 1.0
    cutForPositron: 1.0
    cutForMuon: 1.0
    cutForNeutron: 1.0
    minEnergyRangeProductionCuts: 1.0 keV
    maxEnergyRangeProductionCuts: 1.0 GeV

    physicsList:
      - name: "G4EmLivermorePhysics"
      - name: "G4DecayPhysics"
      - name: "G4RadioactiveDecayPhysics"
      - name: "G4HadronElasticPhysicsHP"
      - name: "G4IonBinaryCascadePhysics"
      - name: "G4HadronPhysicsQGSP_BIC_HP"
      - name: "G4NeutronTrackingCut"
      - name: "G4EmExtraPhysics"
