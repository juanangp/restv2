# Transport and amplification tables of Ar + 1% iC4H10 (AlphaCAMM gas):
#   restGarfield packages/restGarfield/examples/ArIso.yaml
# adds the tables to the mediumFile of the medium (ArIso.root in the current directory by default; tables
# that already exist are skipped), used by the TRestDetectorMedium of the analysis with
# `mediumFile: "ArIso.root"` and drawn with
#   restRoot -> REST_Garfield_DrawMedium("ArIso.root")
# Magboltz is slow: about some minutes per field node of the transport table, and the microscopic avalanches
# of the gain table take seconds each at gains of ~1e4.

transportManager:
  class: "TRestDetectorTransportManager"

  medium:
    class: "TRestDetectorMedium"
    name: "ArIso"
    state: "gas"
    components: {Ar: 99, iC4H10: 1}

  # One table per temperature at one pressure: the medium scales it with E/p to the pressure of the run
  # (REST_Garfield_DrawMedium("ArIso.root", "", 2) compares it with tables at other pressures)
  transport:
    temperatures: [293.15]
    fieldRange: [30 V/cm, 500 V/cm]
    fieldNodes: 30
    logField: true
    nCollisions: 20
    maxElectronEnergy: 400 eV


